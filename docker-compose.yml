# Local development only. Nothing platform-specific here (no Vercel/Railway/Render
# config) — plain Docker/Compose, so this matches how things will actually run in
# any future environment, including AWS (RDS in production instead of the postgres
# service below, ECS/Fargate instead of these container definitions, but the same
# images and the same docker-compose-validated behavior).
#
# Day-to-day dev: `docker compose up -d postgres`, then run `api`/`web` directly
# with `npm run start:dev` / `npm run dev` for fast reload.
#
# Full-stack validation (build and run the actual Dockerfiles, closer to how this
# will run once deployed): `docker compose --profile full up --build`

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cashmere_lovers_club
    ports:
      - "5432:5432"
    # postgres:18+'s official image expects a single mount at
    # /var/lib/postgresql (it places version-specific data in a subdirectory
    # itself) — the previous /var/lib/postgresql/data mount is the pre-18
    # convention and made the container refuse to start against this image
    # ("Error: in 18+, these Docker images are configured to store database
    # data in a format which is compatible with pg_ctlcluster..."), caught
    # 2026-09-26 during this engagement's first real build-test of this file
    # (no Docker daemon existed in dev until the production VPS).
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["full"]
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/cashmere_lovers_club?schema=public}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production}
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET:-dev-only-staff-secret-do-not-use-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SHOPIFY_SHOP_DOMAIN: ${SHOPIFY_SHOP_DOMAIN:-your-store.myshopify.com}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-placeholder}
      SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-https://placeholder.example.com/auth/shopify/callback}
      # Missing entirely before 2026-09-26 — real webhook signature
      # verification (ShopifyWebhookGuard) would fail closed against every
      # request without this set to the real value in production.
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET:-placeholder}
      # Separate app/credentials from SHOPIFY_CLIENT_ID above — see
      # src/shopify-admin/. Missing entirely before 2026-10-06: having a key
      # in .env does NOT mean Compose passes it into the container — only
      # keys actually listed here get through, regardless of what .env has.
      # Caught live the same way SHOPIFY_WEBHOOK_SECRET's gap was: a real
      # TypeError from ConfigService.getOrThrow in production, not assumed.
      SHOPIFY_ADMIN_CLIENT_ID: ${SHOPIFY_ADMIN_CLIENT_ID:-placeholder}
      SHOPIFY_ADMIN_CLIENT_SECRET: ${SHOPIFY_ADMIN_CLIENT_SECRET:-placeholder}
      SHOPIFY_ADMIN_REDIRECT_URI: ${SHOPIFY_ADMIN_REDIRECT_URI:-https://placeholder.example.com/auth/shopify/admin-callback}
      # Same gap, same fix — present in .env since 2026-10-05 but never
      # actually reaching the container until now.
      MAILCHIMP_API_KEY: ${MAILCHIMP_API_KEY:-placeholder}
      # Added 2026-10-08 alongside MailchimpService — listed here from the
      # start specifically because the gap above (a key sitting unused in
      # .env for days before anyone noticed) has now happened three separate
      # times this engagement. Not derivable from the API key itself.
      MAILCHIMP_AUDIENCE_ID: ${MAILCHIMP_AUDIENCE_ID:-placeholder}
      # Optional (session-cookie.util.ts reads it with .get, not .getOrThrow)
      # so its absence never crashed anything, unlike the vars above — but it
      # was silently not applying either. Blank default matches .env.example's
      # "leave unset for local dev" note; real value only matters once the
      # frontend and backend need to share a cookie across subdomains.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "3000:3000"
    # Staff-uploaded images (site hero photos, Stories & Knowledge, events, etc.)
    # are written to ./uploads inside the container — without a volume here they
    # live only in that container's writable layer and are silently lost on every
    # `docker compose up -d --build api` (i.e. every deploy). Named volume, not a
    # bind mount, so it also works unchanged on a fresh host.
    volumes:
      - api_uploads:/app/uploads

  web:
    profiles: ["full"]
    build:
      context: ./web
      # NEXT_PUBLIC_API_URL and API_PROXY_TARGET must ALSO be passed as
      # build args (see the Dockerfile's own comments) — the environment:
      # entry below only affects the running container, which is too late
      # for values `next build` bakes in (the client bundle for the first,
      # the rewrites() routing manifest for the second).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      # Missing entirely before 2026-09-26 — next.config.ts's server-side
      # rewrites use this (not NEXT_PUBLIC_API_URL, which is browser-facing)
      # to reach the api container over the compose network. Without it,
      # every proxied request falls back to localhost:3000 *inside the web
      # container itself*, which has nothing listening on it.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:3000}
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  api_uploads:
